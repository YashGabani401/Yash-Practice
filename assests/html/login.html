<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Practice Page By Yash Gabani">
        <meta name="keywords" content="html, css, practice, yash, yash gabani">
        <link rel="stylesheet" href="../css/style.css">
        <title>Contact Page</title>
    </head>

    <body>
        <header class="navbar">
            <div class="logo">
                <a href="/index.html"><img src="../images/Yash.jpg" alt="brand-logo" width="50" height="50"></a>
            </div>

            <nav class="nav-links">
                <ul>    
                    <li><a href="/index.html">Home</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
            </nav>
            
            <nav class="nav-right">
                <ul>
                    <li><a href="./login.html" class="active">Login</a></li>
                    <li><a href="">Get Started</a></li>
                </ul>
            </nav>
        </header>

        <main>
            <!-- ----- login heading ----- -->
            <h1>Welcome Back</h1>

            <p>Enter your email and password to access your account.</p>

            <!-- ----- form ----- -->
            <form>
                <label>Email<br>
                    <input type="email" name="email" id="email" required>
                </label><br>

                <label>Password<br>
                    <input type="password" name="password" id="password" required>
                </label><br>

                <label><br>
                    <input type="checkbox" name="rememberme" id="rememberme" required>Remember Me
                </label>

                <a href="">Forgot Your Password?</a><br><br>
                
                <button type="submit">Log In</button>

                <p>---------- Or Login With ----------</p>

                <button type="button">Google</button>
                <button type="button">Apple</button><br><br>

                <span>Don't Have An Account?</span> <a href="">Register Now.</a>
        </main>
    </body>
</html>
