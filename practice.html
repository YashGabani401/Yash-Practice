<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slider</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css" />

    <script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>
    <style>
        * {
           box-sizing: border-box;
           margin: 0;
           padding: 0;
        }

        .swiper {
          width: 100vw;
          height: 100vh;
        }

        .swiper-pagination-bullet {
          width: 30px;
          height: 30px;
          color: white;
          background-color: black;
        }

        body {
          font-size: 25px;
          font-weight: 500;
        }

        img {
          width: 80%;
          height: 90%;
          margin: 1% 0px 0px 10%;
        }
    </style>
</head>
<body>
    <div class="swiper">
      <div class="swiper-wrapper">
        <div class="swiper-slide"><img src="../AZG_Assignments/normal/yashgabani-sfs/assets/images/gallery/hero/bloom-1.png"></div>
        <div class="swiper-slide"><img src="../AZG_Assignments/normal/yashgabani-sfs/assets/images/gallery/hero/bloom-2.png"></div>
        <div class="swiper-slide"><img src="../AZG_Assignments/normal/yashgabani-sfs/assets/images/gallery/hero/bloom-3.png"></div>
      </div>
      
      <div class="swiper-pagination"></div>
    
      <div class="swiper-button-prev"></div>
      <div class="swiper-button-next"></div>
    
      <div class="swiper-scrollbar"></div>
    </div>

    <script type="module">
      import Swiper from 'https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.mjs'

      const swiper = new Swiper(...)
    </script>

    <script>
        const swiper = new Swiper('.swiper', {
          // Optional parameters
          loop: true, 

          // If we need pagination
          pagination: {
            el: '.swiper-pagination',
            clickable: true,
          },

          // Navigation arrows
          navigation: {
            nextEl: '.swiper-button-next',
            prevEl: '.swiper-button-prev',
          },

          // And if we need scrollbar
          scrollbar: {
            el: '.swiper-scrollbar',
          },
        });

      var swiper2 = new Swiper('.swiper', {
        pagination: {
          el: '.swiper-pagination',
          clickable: true,
          renderBullet: function (index, className) {
            return '<span class="' + className + '">' + (index + 1) + '</span>';
          },
        },
      });
    </script>
</body>
</html>
