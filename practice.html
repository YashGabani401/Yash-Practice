        .ball-wrapper {

          background-color: black;
          display: flex;
          justify-content: center;
          position: relative;
        }

        .ball {
          width: 100px;
          height: 100px ;
          border-radius: 50%;
          background-image: radial-gradient(white 10%, red 50%);
          margin-top: 50px;
          filter: blur(1px);
          position: absolute;
          animation-name: ball-jump;
          animation-duration: 3s;
          animation-iteration-count: infinite;
          animation-timing-function: ease-in;
