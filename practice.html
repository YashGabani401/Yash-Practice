<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation Practice</title>
    <style>
        * {
           box-sizing: border-box;
           margin: 0;
           padding: 0;
        }

        .ball-wrapper {
          width: 100vw;
          height: 100vh;
          background-color: black;
          display: flex;
          justify-content: center;
          position: relative;
        }

        .ball {
          width: 100px;
          height: 100px ;
          border-radius: 50%;
          background-image: radial-gradient(white 10%, red 50%);
          margin-top: 50px;
          filter: blur(1px);
          position: absolute;
          animation-name: ball-jump;
          animation-duration: 3s;
          animation-iteration-count: infinite;
          animation-timing-function: ease-in;
        }

        @keyframes ball-jump {
          0% {
            top: 0%;
          } 25% {
            animation-timing-function: ease-out;
          } 49% {
            transform: scaleX(1);
          } 50% {
            top: 78%;
            transform: scaleX(1.2);
            animation-timing-function: ease-out;
          } 100% {
            top: 0%;
            transform: scaleX(1);
          }
        }
    </style>
</head>
<body>
    <div class="ball-wrapper">
        <div class="ball"></div>
    </div>
</body>
</html>
