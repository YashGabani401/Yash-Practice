<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice Page</title>
    <meta name="description" content="Practice Page For Html & CSS">
    <meta name="keywords" content="html, css, practice page">
    <link rel="stylesheet" href="../assests/css/style.css">
</head>

<body>
    <header class="navbar">
        <div class="logo">
            <a href="../index.html">
                <img src="../assests/images/Yash.jpg" alt="My Brand" height="50" width="50">
            </a>
        </div>  

        <a class="main-title" href="about.html">
            <h1>About Page</h1>
        </a>

        <div>
            <button class="hamburger" id="hamburger-btn" aria-label="Toggle navigation" aria-expanded="false">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <nav class="nav-container">
            <ul class="nav-links" id="nav-links">
                <li><a href="../index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
        </div>

    </header>
        
    <main>
        <script>
            document.addEventListener('DOMContentLoaded', () => {
                const hamburger = document.getElementById('hamburger-btn');
                const navLinks = document.getElementById('nav-links');

                if (hamburger && navLinks) {
                    hamburger.addEventListener('click', () => {
                        const isExpanded = navLinks.classList.toggle('active');
                        hamburger.setAttribute('aria-expanded', isExpanded);
                    });
                }
            });
        </script>

        <br>
        <h2>About Section</h2>

        <p>This website is created by Yash Gabani to practice HTML & CSS.</p>
    </main>
</body>
</html>
