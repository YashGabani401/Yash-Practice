<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Start Page</title>

    <!-- ===== Lato font-family ===== -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato&display=swap" rel="stylesheet">

    <!-- ===== Montserrat font-family ===== -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital@0;1&display=swap" rel="stylesheet">

    <!-- ===== font-awesome icon ===== -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    <!-- ===== Custom Styles ===== -->
     <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Montserrat", sans-serif;
            font-weight: 400;
            font-size: 15px;
            line-height: 1.5;
        }

        p {
            font-family: 'Lato', sans-serif;
        }

        h1, h2 {
            font-weight: 400;
        }

        a {
            text-decoration: none;
            color: white;
            background-color: #f44336;
            font-size: 18px;
            padding: 12px 24px;
        }

        ul {
            list-style-type: none;
        }

        .float-left {
            float: left;
        }

        .clearfix::after {
            content: "";
            display: block;
            clear: both;
        }

        .para-lg {
            font-size: 24px;
            margin: 24px 0px 40px;
        }

        /* ===== header styles ===== */
        header {
            background-color: #f44336;
            box-shadow: 0 2px 5px 0 rgba(0, 0, 0, 0.16), 0 2px 10px 0 rgba(0, 0, 0, 0.12);
            position: relative;
            z-index: 1;
        }

        header ul a {
            display: inline-block;
        }

        header ul a.active,
        header ul a:hover {
            background-color: #ffffff;
            color: #000000;
        }

        header ul a.active:hover,
        .hero-section button:hover {
            background-color: #cccccc;
            color: #000000;
        }
        
        /* ===== hero-section ===== */
        .hero-section h1 {
            text-transform: uppercase;
            font-size: 64px;
        }

        .hero-section {
            background-color: #f44336;
            color: #ffffff;
            text-align: center;
            padding: 92px 0px 128px;
        }

        .container {
            max-width: 1012px;  
            width: 100%;
            margin: 0 auto;
            padding: 0px 16px;
        }

        .hero-section button {
            background-color: #000000;
            color: #ffffff;
            border: none;
            padding: 12px 24px;
            font-size: 18px;
            font-family: "Montserrat", sans-serif;
            line-height: 1.5;
        }
     </style>
</head>
<body>
    <header>
        <nav>
            <ul class="clearfix">
                <li class="float-left"><a href="" class="active">Home</a></li>
                <li class="float-left"><a href="">Link 1</a></li>
                <li class="float-left"><a href="">Link 2</a></li>
                <li class="float-left"><a href="">Link 3</a></li>
                <li class="float-left"><a href="">Link 4</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="hero-section">
            <div class="container">
                <h1>start page</h1>
                <p class="para-lg">Template by w3.css</p>
                <button type="button">Get Started</button>
            </div>
        </section>
    </main>
</body>
</html>
