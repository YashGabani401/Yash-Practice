<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    <style>
        /* ===== Custom Styles ===== */
        * {
           box-sizing: border-box;
           margin: 0;
           padding: 0;
        }

        body {
            background-color: #2a0a4d;
            color: #D1C4E9;
            font-size: 16px;
            font-weight: 500;
            line-height: 1.5;
        }

        a {
            color: inherit;
            text-decoration: none;
            transition: 0.3s all ease;
            display: inline-block;
            bottom: 0;
        }

        ul {
            list-style-type: none;
        }

        li {
            transition: 0.3s all ease;
        }

        /* ===== classes ===== */
        .container {
            max-width: 1490px;
            width: 100%;
            margin: 0 auto;
            padding: 20px 20px;
        }

        /* ===== header ===== */
        .navbar ul {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
        }

        .navbar .ul-2 a {
            margin-left: 30px;
        }

        .navbar .ul-2 {
            position: relative;
            right: 518px;
        }

        /* ===== hover effects ====== */
        .navbar .nav-links > ul > li:first-child:hover {
            transform: scaleX(1.1);
        }

        .navbar .nav-links .ul-2 a:hover {
            position: relative;
            bottom: 3px;
            color: #E056FD;
        }

        .navbar .nav-links .ul-2 a::after {
            content: '';
            width: 0%;
            height: 3px;
            background-color: #E056FD;
            position: absolute;
            left: 0;
            bottom: 0;
            border-radius: 2px;
            transition: 0.3s all ease;
        }

        .navbar .nav-links .ul-2 a:hover::after {
            width: 100%;
        }
    </style>
</head>
<body>  
    <header>
        <section class="navbar">
            <nav class="nav-links">
                <ul class="container">
                    <li><a href="">YG Portfolio</a></li>
                    <ul class="ul-2">
                        <li><a href="">About</a></li>
                        <li><a href="">Skills</a></li>
                        <li><a href="">Projects</a></li>
                        <li><a href="">Experience</a></li>
                        <li><a href="">Contact</a></li>
                    </ul>
                </ul>
            </nav>
        </section>
    </header>
</body>
</html>
