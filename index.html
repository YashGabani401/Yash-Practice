<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning javaScript</title>
</head>
<body>
    <p id="kk"></p>

    <script>
        let text = "";

        for (let x = 0; x < 5; x++) {
            text += "number is: " + x + "<br>";
        }

        document.getElementById('kk').innerHTML = text;
    </script>
</body>
</html>
