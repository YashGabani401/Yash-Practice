<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice Page</title>
    <meta name="description" content="Practice Page For Html & CSS">
    <meta name="keywords" content="html, css, practice page">
    <link rel="stylesheet" href="assests/css/style.css">
</head>

<body>
    <header class="navbar">
        <div class="logo">
            <a href="index.html">
                <img src="./assests/images/Yash.jpg" alt="My Brand" height="50" width="50">
            </a>
        </div>  

        <a class="main-title" href="index.html">
            <h1>Home Page</h1>
        </a>

        <div>
            <button class="hamburger" id="hamburger-btn" aria-label="Toggle navigation" aria-expanded="false">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <nav class="nav-container">
            <ul class="nav-links" id="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="./webpages/about.html">About</a></li>
                <li><a href="./webpages/contact.html">Contact</a></li>
            </ul>
        </nav>
        </div>

    </header>
        
    <main>
        <script>
            document.addEventListener('DOMContentLoaded', () => {
                const hamburger = document.getElementById('hamburger-btn');
                const navLinks = document.getElementById('nav-links');

                if (hamburger && navLinks) {
                    hamburger.addEventListener('click', () => {
                        const isExpanded = navLinks.classList.toggle('active');
                        hamburger.setAttribute('aria-expanded', isExpanded);
                    });
                }
            });
        </script>

        <br>
        <h2>Enter Your Details</h2>
        
        <form>
            <input type="text" name="username" id="username" placeholder="Your Name" minlength="2" maxlength="32" pattern="[a-zA-z]+" title="Please enter a valid name." required><br><br>
            <input type="email" name="email" id="email" placeholder="Email" title="Please enter a valid email." minlength="2" maxlength="32" required><br><br>
            <input type="tel" name="phonenumber" id="phonenumber" placeholder="Mobile Number
            " pattern="[0-9]{10}" minlength="2" maxlength="32" title="Enter a valid 10-digit number." required><br><br>
            <textarea type="text" name="message" id="message" rows="3" placeholder="Message" minlength="2" maxlength="32" title="Please enter your message."></textarea><br><br>
            <button type="submit">Submit</button>
        </form>
    </main>
</body>
</html>
